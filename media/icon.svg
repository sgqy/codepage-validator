<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>CP932 yen-to-backslash round-trip warning</title>
  <rect width="256" height="256" rx="52" fill="#172333"/>
  <rect x="17" y="17" width="222" height="222" rx="37" stroke="#34465C" stroke-width="2"/>
  <!-- Yen sign: CP932 can encode it, but decoding returns a backslash. -->
  <path d="M42 67 73 111 104 67 M73 111V157 M45 116H101 M45 137H101"
        stroke="#FF7878" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 68 204 157" stroke="#E9F2FF" stroke-width="13" stroke-linecap="round"/>
  <path d="M118 112H145 M136 103 145 112 136 121"
        stroke="#8BA4BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Warning squiggle echoes the editor's diagnostic underline. -->
  <path d="M39 184 48 176 57 184 66 176 75 184 84 176 93 184 102 176 111 184"
        stroke="#FFC66D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
